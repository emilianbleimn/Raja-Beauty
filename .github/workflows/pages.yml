name: Seite veroeffentlichen

on:
  # Nur der Standard-Branch. Die Umgebung "github-pages" laesst per
  # Branch-Schutzregel ausschliesslich die als Pages-Quelle eingestellte
  # Branch deployen; ein Lauf von einem Feature-Branch wird schon am
  # Umgebungs-Gate abgewiesen - ohne einen einzigen Schritt und ohne Log,
  # also als roter Lauf bei jedem Push. Vorschau vorher: lokal per
  # "python3 -m http.server", live wird es mit dem Merge.
  push:
    branches: [claude/nice-feynman-wz2q07]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Hinweis: Pages muss einmalig unter Settings > Pages mit
      # Source = "GitHub Actions" aktiviert werden. Der GITHUB_TOKEN eines
      # Workflows darf eine Pages-Site deployen, aber nicht erstmalig anlegen
      # ("Resource not accessible by integration"), daher kein enablement hier.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
